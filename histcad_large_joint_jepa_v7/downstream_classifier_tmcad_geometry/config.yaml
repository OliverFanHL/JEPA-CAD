seed: 97
paths:
  checkpoint: ../outputs/full_dataset_4096/best.pt
  tmcad_processed: ../downstream_classifier_tmcad/data/processed
  feature_cache: ../downstream_classifier_tmcad_brep_views/data/processed
  geometry_cache: data/processed
  output: outputs/default

alternative:
  selection: geometry_balanced_v1
  max_step_instances: 256

classifier:
  # Compare identical frozen JEPA inputs and classifier settings. Only the
  # second arm receives full-file dimensionless geometric descriptors.
  models: [pooled_plus_brep_view, pooled_plus_brep_view_geometry]
  attention_heads: 8
  hidden_width: 256
  dropout: 0.25
  batch_size: 48
  num_workers: 0
  epochs: 50
  learning_rate: 0.0002
  minimum_learning_rate: 0.00002
  weight_decay: 0.0001
  label_smoothing: 0.02
  patience: 8
  min_epochs: 8
  gradient_clip: 1.0
  device: auto

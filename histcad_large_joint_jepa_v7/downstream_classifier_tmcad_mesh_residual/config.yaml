seed: 97
paths:
  # Inputs remain read-only. All newly generated data/results stay here.
  baseline_checkpoint: ../downstream_classifier_tmcad_mesh/outputs/default/pooled_plus_brep_view_geometry_mesh/best.pt
  manifest: ../downstream_classifier_tmcad/data/processed/manifest.json
  frozen_views: ../downstream_classifier_tmcad_brep_views/data/processed
  geometry_cache: ../downstream_classifier_tmcad_geometry/data/processed/geometry.npy
  geometry_metadata: ../downstream_classifier_tmcad_geometry/data/processed/geometry_metadata.json
  mesh_cache: ../downstream_classifier_tmcad_mesh/data/processed/mesh_profile.npy
  mesh_metadata: ../downstream_classifier_tmcad_mesh/data/processed/mesh_profile_metadata.json
  processed: data/processed
  output: outputs/default

baseline:
  expected_validation_macro_f1: 0.857505665866789
  validation_tolerance: 0.002
  batch_size: 64
  num_workers: 0
  device: auto

adapter:
  variants: [physical_residual, conditional_residual]
  physical_width: 96
  context_width: 64
  fusion_width: 96
  dropout: 0.25
  epochs: 32
  batch_size: 96
  learning_rate: 0.0003
  minimum_learning_rate: 0.00003
  weight_decay: 0.001
  residual_l2: 0.01
  label_smoothing: 0.02
  gradient_clip: 1.0
  patience: 7
  min_epochs: 8
  minimum_validation_macro_f1_gain: 0.003
  minimum_conditional_over_physical_gain: 0.002

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histcad-large-joint-jepa"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pyyaml", "torch"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
visualization = ["cadquery-ocp", "matplotlib", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"run.py" = ["E402"]
